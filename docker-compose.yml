# Self-hosted Luma dashboard.
#
# Setup:
#   1. Create .env next to this file (see .env.example) with:
#
#        PUBLIC_URL=https://luma.example.com
#        INSTANCE_SECRET=<64 hex characters>
#
#      INSTANCE_SECRET is the root secret of the backend; every admin key is
#      derived from it, so keep it private and never change it once data
#      exists. Generate it with:
#
#        openssl rand -hex 32
#
#      (pwgen and similar tools are not suitable: it must be exactly 64
#      lowercase hex characters.)
#
#   2. docker compose up -d
#
#   3. Get an admin key for the admin UI whenever you need one:
#
#        docker compose exec backend admin-key
#
# Exposed ports:
#   web           PUBLIC_URL. Serves the dashboard and the sync API that Luma
#                 and the dashboard use. Put this behind your HTTPS proxy and
#                 enter the same URL under Server in Luma.
#   convex-admin  127.0.0.1 only. Convex's admin UI with full backend access.
#                 From another machine use an SSH tunnel:
#                   ssh -L 6791:127.0.0.1:6791 <host>
#                 then open http://127.0.0.1:6791 and sign in with
#                 http://127.0.0.1:6791 as the deployment URL.
#
# To build the images from source instead of pulling them:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  # Convex backend with the dashboard functions. Not published; reached
  # through the web and convex-admin containers.
  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/vbbot}/luma-dashboard-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    volumes:
      - convex-data:/convex/data
    environment:
      INSTANCE_SECRET: ${INSTANCE_SECRET:?Set INSTANCE_SECRET in .env (generate with openssl rand -hex 32)}
      CONVEX_CLOUD_ORIGIN: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      # Optional GitHub token (no scopes needed) so App Store refreshes are
      # not limited to 60 GitHub API requests an hour.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready && curl -fs http://localhost:3210/version"]
      interval: 5s
      start_period: 60s

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/vbbot}/luma-dashboard-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  convex-admin:
    image: ${IMAGE_PREFIX:-ghcr.io/vbbot}/luma-dashboard-convex-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CONVEX_ADMIN_PORT:-6791}:6791"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  convex-data:
